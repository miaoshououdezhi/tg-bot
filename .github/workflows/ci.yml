name: Local checks and image build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Compose syntax (placeholder values, no services started)
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.proxy.yaml config --quiet
      - name: Build locally, never publish
        run: docker build --tag tg-bot:ci .
